<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7a1010">
<title>丸事星期二 · 掃碼點餐｜實際 vs 理想</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang HK","PingFang SC","Microsoft JhengHei","Noto Sans HK",system-ui,sans-serif;
       background:#faf6f2;color:#2b2118;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 18px}
  .card{background:#fff;border-radius:22px;box-shadow:0 14px 44px rgba(122,16,16,.13);max-width:440px;width:100%;
        padding:30px 26px 34px;text-align:center;border-top:8px solid #d94a18}
  .brand{font-size:12px;letter-spacing:.22em;color:#a08b7c;margin-bottom:12px}
  h1{font-size:22px;color:#7a1010;margin-bottom:6px;letter-spacing:.02em}
  .sub{font-size:13px;color:#8b7767;margin-bottom:20px;line-height:1.7}
  .qrbox{width:min(300px,74vw);margin:0 auto 18px;background:#fff;border:1px solid #eee2d8;border-radius:14px;padding:12px}
  .qrbox svg{display:block;width:100%;height:auto}
  .seal{display:inline-block;font-size:12.5px;font-weight:700;color:#7a1010;border:1.5px solid #d94a18;
        border-radius:999px;padding:7px 15px;margin-bottom:18px;background:#fff6f0;line-height:1.5}
  .url{font-size:11.5px;color:#9c8b7d;word-break:break-all;line-height:1.6;margin-bottom:20px}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  button,a.btn{font-family:inherit;font-size:14px;font-weight:600;border:none;border-radius:11px;
        padding:12px 20px;cursor:pointer;text-decoration:none;display:inline-block}
  .primary{background:#d94a18;color:#fff}
  .ghost{background:#f3ece6;color:#7a1010}
  .tip{font-size:11.5px;color:#a89a8c;margin-top:20px;line-height:1.7}
  @media print{body{background:#fff;padding:0} .card{box-shadow:none;border-top-width:6px} .row,.tip{display:none}}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">大埔振興肉丸 × 合作食肆</div>
    <h1>丸事星期二</h1>
    <p class="sub">用手機掃下方二維碼，即可看到<br>實際系統與我們的建議版本對照</p>
    <div class="qrbox"><div id="qr"></div></div>
    <div class="seal">大埔振興供應 · 1967 · 百分百牛肉</div>
    <p class="url">https://kevinwen1874-cell.github.io/Acadamic/tpch-pos-demo/</p>
    <div class="row">
      <a class="btn primary" href="../tpch-pos-demo/">直接開啟點餐頁</a>
      <button class="btn ghost" id="dl">下載 QR 圖（PNG）</button>
      <button class="btn ghost" onclick="window.print()">列印</button>
    </div>
    <p class="tip">提示：點餐頁頂部可切換「實際系統 / 理想版本」<br>逐項對照現況與建議改動。</p>
  </div>

<script>
/* 二維碼點陣：1 = 黑格，內容為本頁上方顯示的網址 */
var M = [
"111111100111011001100000001111111",
"100000101101100001101110101000001",
"101110101000001110001111001011101",
"101110101111101011110101101011101",
"101110100001111110111111101011101",
"100000100111100101101110001000001",
"111111101010101010101010101111111",
"000000001101100110011011100000000",
"100000101011011011010010111001110",
"001111010000010101111011000011100",
"001100100001111110000110000010110",
"100010000100010000001000110111101",
"110101111111010010011000101100000",
"010010000100100000111011001100011",
"011000110100111110000110011011110",
"110001000011000100001000110011101",
"111100111110100001001011110110001",
"001110001111101110110001001001101",
"111010100111010101010111101101111",
"101010001100011110111001000011101",
"000100111111011101001010110111000",
"100000000100011111110111000111000",
"100110111110010110001010001001010",
"100111011000000110101000011000111",
"111100100111001010000010111111010",
"000000001100010110110011100010101",
"111111100100110100000001101010110",
"100000100100011100001001100011111",
"101110100111100001010010111111010",
"101110100111011111110001110111011",
"101110100101011101011110110110011",
"100000100100001010100010000111100",
"111111101010110001111001110100110"
];
var N = M.length, Q = 4, T = N + Q * 2;

(function draw(){
  var d = '';
  for (var y = 0; y < N; y++) {
    var r = M[y], x = 0;
    while (x < N) {
      if (r.charAt(x) === '1') {
        var x0 = x;
        while (x < N && r.charAt(x) === '1') x++;
        var w = x - x0;
        d += 'M' + (x0 + Q) + ' ' + (y + Q) + 'h' + w + 'v1h' + (-w) + 'z';
      } else { x++; }
    }
  }
  document.getElementById('qr').innerHTML =
    '<svg viewBox="0 0 ' + T + ' ' + T + '" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg"'
    + ' role="img" aria-label="丸事星期二點餐對照頁二維碼">'
    + '<rect width="' + T + '" height="' + T + '" fill="#ffffff"/>'
    + '<path d="' + d + '" fill="#111111"/></svg>';
})();

document.getElementById('dl').onclick = function () {
  var S = 16, c = document.createElement('canvas');
  c.width = c.height = T * S;
  var g = c.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = '#000000';
  for (var y = 0; y < N; y++) {
    for (var x = 0; x < N; x++) {
      if (M[y].charAt(x) === '1') g.fillRect((x + Q) * S, (y + Q) * S, S, S);
    }
  }
  var a = document.createElement('a');
  a.download = '丸事星期二_點餐對照頁二維碼.png';
  a.href = c.toDataURL('image/png');
  a.click();
};
</script>
</body>
</html>
